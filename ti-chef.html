<meta name="description" content="TI CHEF: as receitas da casa, organizadas por grupo.">
<meta name="theme-color" content="#1F4D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --couve:#1F4D3A;
  --couve-escuro:#143427;
  --esmalte:#F3F8F2;
  --papel:#FFFFFF;
  --curcuma:#F2B632;
  --tomate:#D8412F;
  --tinta:#16241D;
  --hortela:#DCEBDD;
  --cinza:#55665D;
  --linha:#CADBCB;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --texto:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--texto);font-size:17px;line-height:1.55;
  color:var(--tinta);background:var(--esmalte);
  min-height:100vh;min-height:100dvh;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--curcuma);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- Splash ---------- */
#splash{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));
  background-color:var(--couve);
  /* azulejo de cozinha, bem discreto */
  background-image:
    linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),
    linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px);
  background-size:56px 56px;
  color:#fff;text-align:center;
}
.chapeu{width:min(62vw,300px);height:auto;display:block;overflow:visible}
.chapeu .gomo{transform-box:fill-box;transform-origin:50% 100%;animation:crescer .55s cubic-bezier(.2,1.4,.4,1) both}
.chapeu .gomo.g1{animation-delay:.25s}
.chapeu .gomo.g2{animation-delay:.4s}
.chapeu .gomo.g3{animation-delay:.55s}
.chapeu .base{animation:subir .4s ease-out both}
@keyframes crescer{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes subir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#splash h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(3.4rem,17vw,6rem);line-height:.95;letter-spacing:-.02em;
  margin-top:28px;animation:subir .5s .7s ease-out both;
}
#splash p{
  margin-top:12px;font-size:1.1rem;color:var(--hortela);
  animation:subir .5s .8s ease-out both;
}
.btn-entrar{
  margin-top:40px;min-width:220px;padding:18px 40px;border-radius:999px;
  background:var(--curcuma);color:var(--couve-escuro);
  font-family:var(--display);font-weight:800;font-size:1.35rem;
  box-shadow:0 6px 0 #B9861A;
  animation:subir .5s .95s ease-out both;
  transition:transform .08s,box-shadow .08s;
}
.btn-entrar:active{transform:translateY(4px);box-shadow:0 2px 0 #B9861A}

/* ---------- App ---------- */
#app{max-width:760px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topo{
  position:sticky;top:0;z-index:5;background:var(--couve);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
.topo .marca{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;
}
.topo .marca svg{width:34px;height:34px}
.btn-voltar{
  margin-left:auto;padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:.95rem;
}
main{flex:1;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}

.busca{position:relative;margin-bottom:22px}
.busca input{
  width:100%;padding:15px 46px 15px 18px;border-radius:14px;
  border:2px solid var(--linha);background:var(--papel);font-size:1.05rem;
}
.busca input:focus{outline:none;border-color:var(--couve)}
.busca button{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;font-size:1.3rem;color:var(--cinza);
}

h2.titulo{
  font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6.5vw,2.3rem);
  line-height:1.1;letter-spacing:-.015em;margin-bottom:6px;
}
.sub{color:var(--cinza);margin-bottom:20px}

/* Grade de grupos */
.grupos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;list-style:none}
@media(min-width:600px){.grupos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grupo{
  width:100%;height:100%;min-height:132px;text-align:left;
  display:flex;flex-direction:column;gap:8px;
  padding:16px 14px;border-radius:18px;
  background:var(--papel);border:2px solid var(--linha);
  transition:transform .08s,border-color .15s;
}
.grupo:active{transform:scale(.97)}
@media(hover:hover){.grupo:hover,.receita-btn:hover{border-color:var(--couve)}}
.grupo .emoji{
  width:46px;height:46px;border-radius:14px;background:var(--hortela);
  display:grid;place-items:center;font-size:1.5rem;
}
.grupo .nome{font-family:var(--display);font-weight:700;font-size:1.06rem;line-height:1.18;overflow-wrap:break-word}
.grupo .qtd{margin-top:auto;color:var(--cinza);font-size:.92rem}
.grupo.todas{background:var(--couve);border-color:var(--couve);color:#fff}
.grupo.todas .emoji{background:rgba(255,255,255,.16)}
.grupo.todas .qtd{color:var(--hortela)}

/* Lista de receitas (botões) */
.lista{list-style:none;display:flex;flex-direction:column;gap:10px}
.receita-btn{
  width:100%;text-align:left;display:flex;align-items:center;gap:12px;
  padding:16px 16px;border-radius:14px;min-height:60px;
  background:var(--papel);border:2px solid var(--linha);
  font-weight:700;font-size:1.04rem;line-height:1.3;
  transition:transform .08s,border-color .15s;
}
.receita-btn:active{transform:scale(.985)}
.receita-btn::after{
  content:"";flex:none;margin-left:auto;width:9px;height:9px;
  border-right:3px solid var(--couve);border-top:3px solid var(--couve);transform:rotate(45deg);
}
.receita-btn small{display:block;font-weight:400;color:var(--cinza);font-size:.88rem;margin-top:2px}
.letra{
  font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--couve);
  margin:18px 0 2px 4px;
}
.vazio{
  padding:28px 20px;border-radius:16px;background:var(--papel);border:2px dashed var(--linha);
  text-align:center;color:var(--cinza);
}

/* Receita */
.etiquetas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.etiqueta{
  padding:5px 12px;border-radius:999px;background:var(--hortela);color:var(--couve-escuro);
  font-size:.88rem;font-weight:700;text-decoration:none;
}
.etiqueta.rend{background:var(--curcuma)}
.bloco{background:var(--papel);border:2px solid var(--linha);border-radius:18px;padding:18px 16px;margin-bottom:16px}
.bloco h3{font-family:var(--display);font-weight:800;font-size:1.3rem;margin-bottom:10px;color:var(--couve)}
.bloco h4{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:16px 0 6px}
.bloco h4:first-of-type{margin-top:4px}
.ingredientes{list-style:none}
.ingredientes li+li{border-top:1px solid var(--hortela)}
.ingredientes label{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;cursor:pointer}
.ingredientes input{
  flex:none;appearance:none;-webkit-appearance:none;width:24px;height:24px;margin-top:1px;
  border:2px solid var(--couve);border-radius:7px;background:#fff;display:grid;place-items:center;
}
.ingredientes input:checked{background:var(--couve)}
.ingredientes input:checked::after{
  content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);
}
.ingredientes input:checked+span{color:var(--cinza);text-decoration:line-through}
.passos{list-style:none;counter-reset:passo}
.passos li{counter-increment:passo;position:relative;padding:10px 0 10px 46px;min-height:44px}
.passos li+li{border-top:1px solid var(--hortela)}
.passos li::before{
  content:counter(passo);position:absolute;left:0;top:9px;
  width:32px;height:32px;border-radius:50%;background:var(--couve);color:#fff;
  font-family:var(--display);font-weight:800;font-size:1rem;display:grid;place-items:center;
}
.dicas{background:#FFF6DD;border-color:#F0D48A}
.dicas h3{color:#7A5605}
.dicas ul{list-style:none}
.dicas li+li{margin-top:8px}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 18px}
.btn-sec{
  padding:11px 18px;border-radius:999px;border:2px solid var(--couve);color:var(--couve);
  font-weight:700;font-size:.95rem;background:transparent;
}
.btn-sec[aria-pressed="true"]{background:var(--couve);color:#fff}
.rodape{text-align:center;color:var(--cinza);font-size:.85rem;padding:0 16px calc(20px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<section id="splash" aria-label="Abertura">
  <svg class="chapeu" viewBox="0 0 200 180" role="img" aria-label="Chapéu de chef">
    <g class="base">
      <rect x="56" y="84" width="88" height="56" fill="#fff"/>
    </g>
    <circle class="gomo g1" cx="62" cy="84" r="36" fill="#fff"/>
    <circle class="gomo g3" cx="138" cy="84" r="36" fill="#fff"/>
    <circle class="gomo g2" cx="100" cy="64" r="44" fill="#fff"/>
    <g class="base">
      <path d="M82 104v28M100 100v32M118 104v28" stroke="#CADBCB" stroke-width="4" stroke-linecap="round" fill="none"/>
      <rect x="50" y="136" width="100" height="30" rx="8" fill="#F2B632"/>
    </g>
  </svg>
  <h1>TI CHEF</h1>
  <p id="splash-sub">As receitas da casa</p>
  <button class="btn-entrar" id="entrar" type="button">Entrar</button>
</section>

<div id="app" hidden>
  <header class="topo">
    <a class="marca" href="#/inicio" aria-label="TI CHEF, ir para o índice">
      <svg viewBox="0 0 200 180" aria-hidden="true">
        <g fill="#fff"><circle cx="62" cy="84" r="36"/><circle cx="138" cy="84" r="36"/><circle cx="100" cy="64" r="44"/><rect x="56" y="84" width="88" height="56"/></g>
        <rect x="50" y="136" width="100" height="30" rx="8" fill="#F2B632"/>
      </svg>
      TI CHEF
    </a>
    <button class="btn-voltar" id="voltar" type="button" hidden>Voltar</button>
  </header>
  <main id="tela" tabindex="-1"></main>
  <p class="rodape">TI CHEF, receitas da casa</p>
</div>

<script>
"use strict";
const GRUPOS = [
  {id:"frango",  n:"Frango", e:"🍗"},
  {id:"carnes",  n:"Carnes", e:"🥩"},
  {id:"peixes",  n:"Peixes", e:"🐟"},
  {id:"sopas",   n:"Sopas e cremes", e:"🥣"},
  {id:"legumes", n:"Legumes e guarnições", e:"🥦"},
  {id:"tortas",  n:"Tortas, quiches e empadões", e:"🥧"},
  {id:"lanches", n:"Hambúrgueres, quibes e lanches", e:"🍔"},
  {id:"paes",    n:"Pães, tapiocas e panquecas", e:"🥖"},
  {id:"doces",   n:"Doces e sorvetes", e:"🍰"},
  {id:"bebidas", n:"Bebidas e leites vegetais", e:"🥤"},
  {id:"basicos", n:"Básicos e pastas", e:"🥄"}
];

/* Formato: t título · g grupos · rend rendimento · ing ingredientes · prep passos · obs dicas
   Em ing e prep, um item começando com "#" vira subtítulo. */
const RECEITAS = [
/* ===================== FRANGO ===================== */
{id:"frango-crosta-sementes", t:"Filé de frango com crosta de sementes e nuts", g:["frango"],
 ing:["½ kg de filé de frango previamente temperado (30 minutos em salmoura na geladeira)","1 ovo batido","1 colher de sopa de gergelim branco","1 colher de sopa de gergelim preto","3 colheres de sopa de castanhas granuladas (aquelas usadas no sorvete)","1 colher de sopa de tempero chimichurri","#Salmoura","Água suficiente para cobrir os filés","1 colher de sopa de sal","2 colheres de chá de açúcar mascavo","2 colheres de chá de páprica doce","1 folha de louro"],
 prep:["Para a salmoura, coloque os filés em uma tigela com água suficiente para cobri-los, o sal, o açúcar mascavo, a páprica doce e o louro. Tampe e deixe na geladeira por 30 minutos.","Retire os filés da salmoura, passe-os no ovo batido e em seguida na mistura das castanhas com gergelim e chimichurri.","Coloque em um refratário untado com azeite e leve ao forno para assar por 40 minutos."]},

{id:"nugget-frango", t:"Nugget de frango caseiro", g:["frango","lanches"], rend:"6 a 7 porções",
 ing:["400 g de peito de frango cozido e moído (se não tiver processador, compre moído no hortifruti ou peça para moer onde for comprar)","1 colher de sobremesa rasa de mostarda Dijon","1 colher de sopa cheia de farelo de aveia","1 dente de alho médio amassado","3 colheres de sopa de cebola ralada","1 ovo caipira","Sal a gosto","Fubá para empanar a gosto"],
 prep:["Misture todos os ingredientes até formar uma pasta firme. Unte uma superfície lisa com manteiga e abra a massa até ficar com 1,5 cm. Corte os nuggets com um cortador de biscoitos ou modele na mão.","Num prato espalhe o fubá e empane os nuggets até ficarem totalmente cobertos.","Leve ao forno em forma untada e polvilhada com fubá e sirva."],
 obs:["Você pode congelar o nugget cru em potes bem fechados por até 2 meses."]},

{id:"escondidinho-couve-flor-frango", t:"Escondidinho de couve-flor com frango", g:["frango"],
 ing:["1 couve-flor média cozida","2 peitos de frango cozidos e desfiados","1 tomate picado","1 cebola ralada","Alho, sal e pimenta a gosto"],
 prep:["Limpe e lave a couve-flor, retire os talos grandes, deixando só as flores.","Coloque em uma panela com água e um pouco de sal e cozinhe bem, até quase desmanchar.","Escorra toda a água e amasse até obter a consistência de purê. Reserve.","Cozinhe o peito de frango com um pouco de sal e salsinha. Desfie.","Em uma frigideira, coloque um fio de azeite, refogue a cebola, o tomate e o frango desfiado. Acerte o sal.","Montagem: 1ª camada de frango refogado, 2ª camada de purê de couve-flor, e assim sucessivamente. Coloque um pouquinho de salsinha para finalizar."]},

{id:"rolinhos-frango-espinafre", t:"Rolinhos de frango com espinafre e abobrinha", g:["frango"],
 ing:["2 bifes de frango fininhos","1 dente de alho pequeno","Sumo de limão","1 raminho de salsa","Sal e pimenta a gosto","1 abobrinha cortada em tiras","½ molho de espinafre refogado com o dente de alho","3 colheres de sopa de farinha de linhaça (bata as sementes de linhaça no liquidificador)","2 colheres de sopa de azeite"],
 prep:["Lave os bifes de frango e seque-os com papel-toalha.","Tempere os bifes a gosto (sal, pimenta, sumo de limão e salsa fresca picada) 1 hora antes de fazer os rolinhos. Reserve.","Coloque os bifes sobre uma tábua e distribua as tiras de abobrinha e o espinafre refogado. Enrole os bifes e prenda-os com palitos.","Num prato coloque a farinha de linhaça. Passe os rolinhos pela farinha e coloque-os no tabuleiro untado com óleo de canola. Regue cada rolinho com um pouco de azeite.","Cubra o tabuleiro com folha de alumínio e leve ao forno durante 30 minutos. Tire a folha de alumínio e deixe dourar."]},

{id:"frango-salteado-alho-poro", t:"Frango salteado com alho-poró", g:["frango"],
 ing:["300 g de peito de frango em cubos","1 talo de alho-poró pequeno em rodelas","1 colher de sopa de cebola","1 colher de café de azeite","Sal e pimenta a gosto"],
 prep:["Aqueça o azeite, coloque a cebola e refogue rapidamente.","Em seguida, acrescente os cubos de frango e refogue até ficarem cozidos.","Por último, acrescente o alho-poró em rodelas e tempere com sal e pimenta."]},

{id:"frango-assado-tomate-cereja", t:"Frango assado com tomate cereja e manjericão", g:["frango"],
 ing:["4 peitos de frango desossados inteiros","250 g de tomates cereja orgânicos","3 colheres de sopa de azeite","2 colheres de sopa de alcaparras escorridas","2 colheres de sopa de vinagre balsâmico","Sal e pimenta a gosto"],
 prep:["Distribua os peitos de frango, os tomates e as alcaparras em um refratário ou assadeira. Tempere com sal, pimenta, azeite e vinagre balsâmico.","Asse em forno preaquecido a 190 °C por cerca de 20 minutos ou até que a carne esteja cozida."]},

{id:"frango-chuchu-diferente", t:"Frango com chuchu diferente", g:["frango"],
 ing:["1 chuchu médio","1 colher (sopa) de salsinha fresca picada","1 colher (sopa) de azeite de oliva","1 cebola grande descascada e picada","2 dentes de alho descascados e picados","¾ xícara de água","3 colheres de molho de tomates caseiro","1 cenoura descascada e picada em cubinhos","3 tomates sem pele e sem sementes, cortados em pedaços grandes","1 colher (chá) de alecrim","1 colher (chá) de orégano","Sal e pimenta-do-reino a gosto","450 g de filé de peito de frango"],
 prep:["Em um recipiente, coloque o chuchu cozido e cortado em cubos. Polvilhe metade da salsinha, regue com ½ colher (sopa) de azeite e tempere com uma pitada de sal. Reserve.","Numa panela, aqueça em fogo médio ½ colher (sopa) de óleo de canola, acrescente a cebola e o alho. Refogue até dourar.","Adicione metade da água e o molho de tomates e cozinhe até a cebola ficar macia.","Em seguida, adicione a cenoura e deixe cozinhar por alguns minutos, até que ela esteja levemente macia. Adicione o restante da água e deixe reduzir por 4 minutos.","Logo em seguida, acrescente os tomates, o alecrim, o orégano, o sal e a pimenta. Deixe cozinhar mais um pouco, até o tomate murchar bem, aproximadamente 5 minutos.","Grelhe os filés de frango temperados com sal e pimenta numa grelha. Disponha-os em um prato ou refratário e despeje o molho por cima. Sirva com o chuchu."]},

{id:"frango-molho-laranja", t:"Frango com molho de laranja", g:["frango"],
 ing:["300 g de filé de frango","200 ml de suco de laranja","1 colher de sopa de shoyu light","1 colher de café rasa de mostarda em pó","1 colher de café bem rasa de curry","Algumas lasquinhas de gengibre","Pouco sal (o shoyu já tem sal!)"],
 prep:["Pique os filés em cubos pequenos (também pode ser desfiado, como um estrogonofe). Coloque numa panela média para grande os filés e o suco de laranja. Mexa sempre.","Quando o frango começar a cozinhar, coloque o shoyu.","Quando o frango estiver quase totalmente cozido, coloque a mostarda, o gengibre e o curry. Deixe mais uns 10 minutos, até o caldo secar um pouco mais."]},

{id:"bolo-frango-abobrinha", t:"Bolo de frango com abobrinha", g:["frango"], rend:"2 porções",
 ing:["400 g de peito de frango","1 cebola pequena picada","2 colheres de sobremesa de azeite","2 abobrinhas médias picadas","2 tomates médios sem sementes picados","3 colheres de sopa de molho de tomate caseiro","Sal a gosto","#Molho de tomate caseiro","½ cebola picada","1 dente pequeno de alho espremido","1 colher de chá de azeite","2 tomates médios sem pele e sem semente","½ colher de chá de orégano"],
 prep:["#Molho","Refogue a cebola e o alho no azeite.","Acrescente os tomates picados e deixe cozinhar.","Acrescente o orégano no final do cozimento. Reserve.","#Bolo","Pré-aqueça o forno em temperatura média (180 °C).","Bata no processador o frango com a cebola, o azeite (reserve 1 colher de chá) e o sal, até obter uma massa homogênea.","Misture numa tigela a abobrinha, o tomate e o sal e reserve.","Com o azeite reservado, unte uma assadeira tipo de pão de forma.","Reserve uma parte da massa de frango para cobrir e, com a massa restante, forre o fundo e as laterais da assadeira.","Distribua o recheio de legumes, cubra com a massa reservada e o molho de tomate caseiro.","Leve ao forno por aproximadamente 30 minutos, ou até que o frango esteja cozido.","Retire do forno, desenforme e sirva."]},

{id:"frango-legumes-oregano", t:"Frango com legumes e orégano", g:["frango"],
 ing:["300 g de peito de frango cortado em cubinhos","2 tomates sem sementes e sem pele picados","Salsinha picada a gosto","1 colher de sobremesa de azeite","2 dentes de alho amassados","1 cebola ralada","300 g de abobrinha","1 pitada de orégano","Suco de 1 limão"],
 prep:["Tempere o frango com o suco de limão, sal e o orégano. Em uma panela coloque o azeite e refogue o frango. Adicione os tomates, mexa e deixe no fogo por 10 minutos.","Lave a abobrinha e rale no ralo grosso. Em outra panela coloque azeite, o alho e a cebola e refogue bem a abobrinha. Tempere com sal e deixe refogar por 5 minutos. Depois de pronta, reserve.","Em um refratário coloque o frango e, por cima, a abobrinha, espalhando bem. Polvilhe salsinha e sirva em seguida."],
 obs:["O papel original cita vinho no preparo do frango, mas ele não aparece na lista de ingredientes."]},

{id:"escondidinho-abobora-frango", t:"Escondidinho de abóbora com frango desfiado", g:["frango"],
 ing:["300 g de frango temperado, cozido e desfiado","500 g de abóbora","1 batata-inglesa média","Alho, sal, cebola e ervas","Azeite a gosto"],
 prep:["Cozinhe a abóbora e a batata até que fiquem bem molinhas e faça um purê com azeite e a água do cozimento dos legumes. Tempere com ervas e um pouquinho de sal.","Coloque em um pirex um pouco do purê, depois o frango desfiado e termine com o purê."]},

{id:"frango-berinjela", t:"Frango com berinjela", g:["frango"],
 ing:["2 peitos de frango desossados","1 berinjela média","1 cebola bem picadinha","1 colher de sobremesa de gengibre ralado","Sal a gosto","1 dente de alho bem picadinho","Suco de 1 limão"],
 prep:["Coloque a berinjela de molho em água fria com sal e suco de limão por 30 minutos. Abra os peitos de frango com uma faca bem fina, transformando os dois peitos em quatro filés, e tempere com sal e suco de ½ limão.","Unte uma assadeira com azeite. Coloque na assadeira a berinjela cortada e, sobre ela, a cebola picada. Arrume os filés de frango sobre a berinjela. Salpique o alho e o gengibre raladinho.","Cubra com papel-alumínio e leve ao forno alto preaquecido. Depois de uns 20 minutos, retire o papel-alumínio. O frango e a berinjela deverão estar cozidos.","Com o forno em temperatura média, deixe por mais 15 minutos para dourar o frango."]},

{id:"frango-cebola-roxa", t:"Frango com cebola roxa", g:["frango"],
 ing:["½ quilo de filé de frango cortado em bifes grossos","1 pitada de sal marinho","1 pitada de pimenta-do-reino","1 colher de sobremesa de mostarda Dijon","1 colher de sobremesa de azeite","1 xícara de água fervente","1 tomate médio, sem sementes, picado","1 cebola roxa pequena cortada em rodelas finas"],
 prep:["Em uma tigela média, junte o frango, o sal, a pimenta e a mostarda. Misture.","Em uma panela grande, aqueça o azeite em fogo médio e doure o frango.","Junte meia xícara (chá) da água fervente. Cozinhe o frango com a panela tampada, mexendo de vez em quando, por 10 minutos ou até ficar macio. Retire o frango e transfira para uma travessa. Reserve.","Na mesma panela, junte o restante da água, o tomate e a cebola. Cozinhe em fogo médio por 5 minutos, mexendo de vez em quando, ou até murchar a cebola. Sirva em seguida."]},

{id:"frango-assado-limao-siciliano", t:"Frango assado com limão siciliano", g:["frango"],
 ing:["1 kg de peito de frango cortado em pedaços médios","1 limão Tahiti","2 limões sicilianos","½ xícara (chá) de vinho branco seco","½ cabeça de alho (separe os dentes e deixe com a casca)","3 ramos de tomilho fresco","3 colheres (sopa) de azeite extra virgem","Sal e pimenta-do-reino a gosto"],
 prep:["Lave bem os pedaços de frango com limão Tahiti e água.","Corte os limões sicilianos em gomos, mantendo a casca.","Em uma assadeira coloque todos os ingredientes: frango, vinho branco, dentes de alho, limão, folhas de tomilho, azeite, sal e pimenta.","Misture bem com as mãos e arrume os pedaços de frango.","Cubra a assadeira com papel-manteiga. Leve para assar em forno preaquecido a 180 °C por aproximadamente 40 minutos ou até que a carne do frango comece a se desgrudar do osso.","Quando o frango estiver macio e cozido, retire o papel e aumente o forno para 220 °C. Asse até ficar bem dourado."]},

{id:"frango-abobrinha", t:"Frango com abobrinha", g:["frango"],
 ing:["500 g de peito de frango cortado em cubinhos","Sal a gosto","1 colher de chá de mostarda Dijon","Suco de 1 limão","4 dentes de alho amassados","1 fio de azeite","½ cebola bem picada","1 abobrinha cortada em meia-lua","Cebolinha picada para finalizar"],
 prep:["Em uma tigela, tempere o frango com sal, mostarda, limão e alho. Misture bem.","Na panela, aqueça o azeite e acrescente o frango. Deixe dourar por cerca de 3 minutos. Mexa e deixe mais 3 minutos.","Coloque a cebola, misture bem e tampe a panela (mais 2 minutos).","Adicione a abobrinha e deixe que cozinhe até que esteja ao seu gosto, mais ou menos al dente.","Prove e acerte o sal, salpique a cebolinha e sirva."]},

/* ===================== CARNES ===================== */
{id:"bolo-carne-cenoura-linhaca", t:"Bolo de carne com cenoura e linhaça dourada", g:["carnes"],
 ing:["400 g de carne moída","2 colheres de sopa de farinha de linhaça dourada","1 cenoura crua ralada","Azeitonas picadas a gosto","½ cebola ralada","1 dente de alho pequeno amassado","Sal, pimenta, orégano e cheiro-verde a gosto"],
 prep:["Misture bem todos os ingredientes.","Coloque em um pirex ou assadeira untada e leve ao forno para assar."]},

{id:"picadinho-file-tomate-legumes", t:"Picadinho de filé com molho de tomates e legumes", g:["carnes"],
 ing:["300 g de filé mignon em iscas","15 ramos de brócolis cozido no vapor","2 dentes de alho pequenos","2 cenouras médias","½ cebola média","10 vagens francesas ou manteiga em cubinhos","1 copo médio de água","Sal a gosto","5 colheres de sopa de molho de tomates caseiro","½ colher de sopa de azeite"],
 prep:["Esquente a panela com o azeite e refogue a cebola e o alho.","Em seguida, coloque o filé em iscas e os legumes.","Por último, acrescente o molho de tomates e mexa mais um pouco."]},

{id:"file-mignon-legumes", t:"Filé mignon com legumes", g:["carnes"],
 ing:["300 g de filé mignon cortado em tiras finas","2 dentes de alho amassados","½ colher de chá de sal marinho","1 colher de sobremesa de azeite","1 abobrinha pequena cortada em tiras finas","1 cebola média cortada em tiras finas","½ pimentão vermelho orgânico pequeno cortado em tiras finas","1 cenoura média cortada em palitos e cozida"],
 prep:["Em uma tigela, coloque a carne e tempere com o sal e o alho. Reserve.","Em uma frigideira grande, aqueça 1 colher (sopa) de azeite em fogo médio e refogue a abobrinha, mexendo delicadamente até começar a murchar.","Junte a cebola, o pimentão e a cenoura e refogue até dourar levemente. Reserve.","Na mesma frigideira, aqueça o restante do azeite em fogo médio e refogue a carne até perder a cor avermelhada.","Adicione os legumes reservados e misture delicadamente. Sirva em seguida."]},

{id:"berinjela-recheada-carne", t:"Berinjela recheada com carne moída especial", g:["carnes","legumes"],
 ing:["4 berinjelas médias","200 g de carne moída","2 tomates médios","½ cebola","½ cenoura ralada","½ abobrinha ralada","1 dente de alho pequeno","Tempero a gosto","Orégano, manjericão e sal a gosto"],
 prep:["#Berinjelas","Corte a berinjela ao meio, no comprimento.","Com uma colher retire o conteúdo, deixando-a como uma canoa. Reserve o conteúdo, porque você vai usá-lo no recheio.","Coloque as canoas para cozinhar em uma panela de água até que a casca esteja macia. Fique atento para não passar do ponto: a berinjela pode se desmanchar. Depois de cozidas, reserve.","#Recheio","Pique o conteúdo da berinjela e reserve.","Refogue a carne moída com o alho, a cebola e o molho de tomates.","Depois coloque a cenoura, a abobrinha e os cubos de tomate.","Em seguida coloque o conteúdo da berinjela picado. Refogue até que esteja cozido.","#Montagem","Coloque a carne temperada nas berinjelas e sirva em seguida."]},

{id:"barquinhas-abobrinha", t:"Barquinhas de abobrinha com carne moída ou frango desfiado", g:["carnes","legumes"],
 ing:["2 abobrinhas médias ou 4 miniabobrinhas","½ colher (sopa) de azeite","1 cebola pequena, picada","1 dente de alho amassado","200 g de patinho moído ou peito de frango moído","Pitada de sal","1 colher (sopa) de cheiro-verde picado"],
 prep:["Remova as pontas das abobrinhas e corte-as ao meio. Com uma colher, retire a polpa e reserve.","Em uma panela, leve o azeite ao fogo. Junte a cebola e o alho e refogue por um minuto.","Acrescente a carne e a polpa de abobrinha e cozinhe até que ela desmanche. Tempere com sal e cheiro-verde. Deixe secar e retire do fogo.","Recheie as barquinhas e leve-as ao forno moderado (180 °C), preaquecido, em uma assadeira antiaderente coberta com papel-manteiga, por 15 minutos ou até ficarem macias."]},

/* ===================== PEIXES ===================== */
{id:"tilapia-legumes", t:"Filés de tilápia com legumes", g:["peixes"],
 ing:["3 filés médios de tilápia","Suco de meio limão","1 colher de chá de manjericão e orégano secos","1 colher de sobremesa de azeite","Sal e pimenta-do-reino a gosto","2 cenouras e 15 vagens cortadas em tirinhas","Salsinha e cebolinha picadas"],
 prep:["Coloque o forno para aquecer a 180 graus. Numa tigela, tempere os filés previamente lavados com o limão, o sal e a pimenta. Reserve.","Forre o pirex com um pedaço de papel-manteiga, deixando sobras laterais para fechar o peixe depois. Disponha os filés sobre o papel, adicione o azeite e as ervas. Feche o papel-manteiga, deixando bem vedado. Leve ao forno a 180 graus por 30 minutos.","Enquanto o peixe assa, cozinhe no vapor a cenoura e a vagem até que fiquem al dente. Se preferir, cozinhe com pouquinha água e use essa água para cozinhar o arroz depois.","Após os trinta minutos de forno, abra o papel-manteiga, adicione os legumes em volta dos filés e volte ao forno para dourar, com o papel aberto. Deixe gratinar por uns 10 minutos. Cubra com salsinha e cebolinha picadas e está pronto para servir."],
 obs:["Não abuse do sal e da pimenta, pois peixe salga com muita facilidade."]},

{id:"linguado-tomate-oregano", t:"Filés de linguado com tomate e orégano", g:["peixes"],
 ing:["3 filés de linguado médios","1 cebola pequena cortada em rodelas finas","1 colher de sobremesa de azeite","1 colher de chá de alho bem picado","4 tomates bem maduros picados","Sal a gosto","2 colheres de sopa de alcaparras","1 pitada de orégano seco","Pimenta-do-reino moída na hora"],
 prep:["Aqueça o forno a 250 °C. Coloque a cebola e o azeite numa panela rasa e leve ao fogo médio, até que as cebolas comecem a dourar.","Adicione o alho e, quando este começar a tomar cor, acrescente os tomates picados e uma pitada de sal. Misture para incorporar os ingredientes. Cozinhe por cerca de 10 minutos em fogo médio.","Adicione as alcaparras picadas, o orégano e a pimenta-do-reino e mexa por 1 minuto, aumentando o fogo. Retire do fogo.","Lave os filés de linguado e enxugue com cuidado num papel-toalha. Coloque 1 colher (sopa) deste molho no fundo de uma forma refratária. Passe um a um os filés de peixe na panela com o molho, virando-os de lado, e transporte para o recipiente refratário, colocando-os lado a lado.","Regue o molho restante sobre os peixes e asse no forno preaquecido por 7 minutos. Sirva imediatamente."]},

{id:"linguado-espinafre-legumes", t:"Linguado com espinafre e legumes", g:["peixes"],
 ing:["500 g de filé de linguado ou 3 filés","Sal a gosto e suco de 1 limão","1 colher de sobremesa de azeite","50 g de vagem","100 g de espinafre","100 g de palmito","100 g de alho-poró","100 g de cenoura","1 dente de alho"],
 prep:["Tempere os filés de linguado sem pele com sal a gosto e, em seguida, com o suco de limão. Deixe descansando para pegar o tempero.","Grelhe os filés em chapa bem quente umedecida com azeite, ao ponto do seu gosto.","Cozinhe todos os legumes no vapor até que fiquem al dente.","Refogue o espinafre com alho e sirva com o linguado e os legumes."]},
/* ===================== SOPAS ===================== */
{id:"sopa-dica-simples", t:"Sopa coringa: dica simples para qualquer sopa", g:["sopas"],
 ing:["1 a 2 legumes à sua escolha (menos batata-inglesa, batata-baroa, inhame e aipim)","1 cebola grande","3 dentes de alho picados","Água para cobrir","1 pitada de sal"],
 prep:["Refogue a cebola com o alho picado.","Coloque o legume escolhido cortado em pedaços e refogue mais um pouco.","Coloque água para cobrir e uma pitada de sal e espere cozinhar.","Depois é só esfriar e bater no liquidificador. Coma na hora ou guarde em potes de vidro para congelar."],
 obs:["Acompanhe as sopas com salada verde ou folha refogada para melhorar a saciedade!","Podem estar presentes mais tipos de legumes, além dos que aparecem em cada receita."]},

{id:"creme-mandioquinha-quinoa", t:"Creme de mandioquinha com quinoa", g:["sopas"], rend:"5 porções",
 ing:["1 cebola média picada","1 alho-poró picado","1 talo pequeno de salsão picado","1 colher (sopa) de azeite de oliva","6 unidades grandes de mandioquinha (batata-baroa) em cubos","1 e ½ unidade média de cenoura em cubos","½ unidade média de cenoura ralada","2 unidades médias de chuchu em cubos","¾ de xícara de quinoa em grãos","Salsinha e cebolinha fresca picada","Sal a gosto e água"],
 prep:["Cozinhe a quinoa por 20 minutos em água com sal e salpique-a com salsinha e cebolinha. Reserve.","Em outra panela, refogue no azeite a cebola, o alho-poró e o salsão. Acrescente a mandioquinha, o chuchu e a cenoura em cubos.","Cubra de água, coloque pouco sal e cozinhe até amolecer bem.","Bata estes legumes no liquidificador até ficar um creme homogêneo.","Neste creme, acrescente a quinoa cozida e a cenoura ralada. Deixe ferver por uns 3 minutos e desligue o fogo, corrigindo o sal e temperando com salsinha e cebolinha fresca."]},

{id:"sopa-abobora-gengibre", t:"Sopa de abóbora com gengibre", g:["sopas"],
 ing:["1 cebola média picada","1 colher de sobremesa de azeite","1 pitada de gengibre picado","500 g de abóbora amarela em pedaços","Água filtrada (o necessário para cozinhar)","Sal a gosto"],
 prep:["Refogue a abóbora na cebola e no alho, com o azeite, até dourar um pouquinho.","Coloque água fervente só para cobrir e espere cozinhar.","Deixe esfriar um pouco e depois bata no liquidificador até virar um creme.","Leve para a panela, coloque o gengibre e ferva só mais um pouquinho."]},

{id:"sopa-abobrinha-cebola", t:"Sopa de abobrinha com cebola", g:["sopas"],
 ing:["300 g de abobrinha fatiada (cerca de 3 médias)","1 cenoura pequena","1 cebola picada","2 dentes de alho","1 colher de sobremesa de azeite","Água o suficiente","1 colher de sopa de cebolinha fresca picada"],
 prep:["Coloque a abobrinha, a cenoura cortadinha e a cebola e refogue no azeite. Cozinhe em um pouquinho de água em fogo brando por 5 a 10 minutos, até que fiquem macias, sem mudar de cor.","Acrescente mais água, deixe levantar fervura e cozinhe em fogo baixo por 5 minutos.","Tire do fogo, deixe esfriar ligeiramente e depois bata no processador ou liquidificador.","Por último, polvilhe a cebolinha e sirva."]},

{id:"sopa-chuchu-espinafre", t:"Sopa de chuchu com espinafre", g:["sopas"],
 ing:["3 chuchus médios","1 bom maço de espinafre","3 colheres de sopa de cebola","1 dente de alho","1 colher de chá de azeite","Sal a gosto"],
 prep:["Refogue a cebola e o alho no azeite. Coloque o chuchu e refogue.","Depois de refogado, cubra com água e deixe cozinhar.","Cozido o chuchu, adicione as folhas de espinafre. Acerte o sal. Deixe as folhas cozinharem um pouco.","Bata tudo no liquidificador e sirva quente."]},

{id:"sopa-couve-flor-couve", t:"Sopa de couve-flor com couve", g:["sopas"],
 ing:["1 couve-flor média","1 cebola média picada","2 a 3 dentes de alho pequenos","1 colher de sopa de azeite","1 maço de couve orgânica","1 alho-poró cortado em rodelas finas","Sal a gosto"],
 prep:["Lave bem e pique a couve-flor. Refogue na cebola e no alho até a couve-flor começar a dourar e cubra com água. Espere cozinhar e deixe esfriar.","Bata no liquidificador com a água do cozimento. Vá colocando a água aos poucos para deixar o caldo grossinho.","Em outra panela, refogue o alho-poró rapidamente com a couve, só para dar uma murchada, e coloque a sopa. Ferva por mais 3 a 5 minutos e sirva em seguida."]},

{id:"sopa-chuchu-frango-cenoura", t:"Sopa de chuchu com frango e cenoura", g:["sopas","frango"],
 ing:["1 chuchu médio cortado","1 cenoura média cortada","1 cebola cortada","2 dentes de alho","150 gramas de peito de frango","1 colher de sobremesa de azeite","½ litro de água quente"],
 prep:["Higienize o chuchu, a cenoura e a cebola. Corte os chuchus ao meio, tire a parte branca do centro, descasque-os todos e corte em cubos. Desfie o frango.","Cozinhe tudo em uma panela com aproximadamente 1 litro de água.","Bata no liquidificador com parte do líquido do cozimento.","Coloque a sopa-creme em uma panela, acerte o sal se necessário, junte o restante do líquido e leve ao fogo por mais alguns minutos."]},

{id:"sopa-cenoura-salsao", t:"Sopa de cenoura com salsão", g:["sopas"],
 ing:["½ xícara de cebola picada","2 xícaras de chá de cenoura ralada grosso","1 talo de salsão pequeno ou ½ médio bem picado","1 colher de sopa de cebolinha verde picada","1 pitada de orégano","Sal e pimenta-do-reino a gosto","3 xícaras de água filtrada","1 colher de sobremesa de azeite"],
 prep:["Numa panela, em fogo médio, refogue a cebola, a cenoura e o salsão no azeite, mexendo de vez em quando, até a cebola ficar macia (5 minutos).","Adicione água suficiente para cobrir, misture e deixe ferver.","Abaixe o fogo, tampe a panela, deixando-a um pouco aberta, e cozinhe, mexendo de vez em quando. Sirva quando os legumes estiverem macios."]},

/* ===================== LEGUMES E ACOMPANHAMENTOS ===================== */
{id:"lasanha-legumes", t:"Lasanha de legumes", g:["legumes"],
 ing:["#Molho de tomate","4 tomates maduros cortados em quatro partes, sem pele e sem sementes","2 dentes de alho amassados","½ cebola picadinha","2 colheres de sopa de azeite de oliva extra virgem","1 cenoura ralada","½ xícara de brócolis bem picadinho","1 punhado de folhas de manjericão","Sal e orégano a gosto","#Lasanha","2 abobrinhas cortadas em fatias finas (sentido longitudinal)","1 berinjela cortada em fatias finas (sentido longitudinal)","2 colheres de sopa de cheiro-verde picadinho","200 g de queijo minas padrão ralado (sem lactose para os intolerantes)"],
 prep:["#Molho","Refogue no azeite o alho e a cebola.","Acrescente o tomate picado, a cenoura, o brócolis e as folhas de manjericão. Abaixe o fogo e deixe cozinhar por 15 minutos.","Tempere com sal e orégano e reserve.","#Lasanha","Em uma frigideira, grelhe em um fio de azeite as fatias de abobrinha e berinjela rapidamente (cerca de 30 segundos de cada lado).","Em um refratário, monte: 1 camada de molho de tomate, 1 camada de abobrinha (salpique 1 colher de sopa de cheiro-verde), molho de tomate, 1 camada de berinjela (salpique 1 colher de sopa de cheiro-verde), molho de tomate e o queijo minas ralado.","Leve ao forno preaquecido por 20 minutos."]},

{id:"legumes-assados-1", t:"Legumes assados 1", g:["legumes"],
 ing:["1 berinjela","1 alho-poró em rodelas","1 cenoura em rodelas","¼ de lata de tomate pelado ou tomate comum","Azeite","#Para temperar","Orégano e tomilho","Sal e pimenta"],
 prep:["Lave bem todos os legumes, corte em pedaços e coloque num pirex.","Tempere com sal e pimenta e polvilhe generosamente com tomilho e orégano.","Regue com azeite e leve ao forno preaquecido a 190 °C durante 20 minutos, ou o tempo necessário para cozinhar."]},

{id:"legumes-assados-2", t:"Legumes assados 2 (ratatouille)", g:["legumes"],
 ing:["2 berinjelas","1 abobrinha italiana","1 pimentão vermelho ou 1 pimentão amarelo pequeno (opcional)","2 tomates","1 cebola","3 dentes de alho","1 xícara (chá) de azeite","¼ xícara (chá) de vinagre de vinho tinto","2 raminhos de tomilho","Sal e pimenta-do-reino a gosto"],
 prep:["Pré-aqueça o forno a 180 °C (temperatura média).","As berinjelas, a abobrinha e os pimentões serão cortados em tiras. Sobre uma tábua, sempre no sentido do comprimento, corte esses legumes ao meio. As metades da berinjela, corte em 3 tiras; as metades da abobrinha, em 2 tiras; dos pimentões, primeiro retire todas as sementes e, em seguida, corte cada metade em 5 tiras.","Com uma faquinha bem afiada, descasque os tomates (como se fosse descascar uma maçã). Corte-os na metade e cada metade em 4 meias-luas. Com o dedo, retire as sementes e descarte.","Descasque a cebola, corte na metade e fatie grosso cada uma delas.","Descasque os dentes de alho e deixe-os inteiros.","Numa travessa refratária, disponha todos os legumes e os ramos de tomilho. Regue com o azeite e com o vinagre.","Tempere os legumes na travessa com sal e pimenta-do-reino. Misture delicadamente.","Cubra com papel-alumínio e leve ao forno preaquecido para assar por 2 horas.","Retire do forno, deixe esfriar por 30 minutos e leve à geladeira por no mínimo 2 horas, se quiser servir a ratatouille gelada. Caso contrário, sirva a seguir."]},

{id:"berinjela-forno-manjericao", t:"Berinjela ao forno com manjericão", g:["legumes"],
 ing:["2 berinjelas grandes em fatias","½ colher de chá de sal","2 dentes de alho amassados","½ colher de chá de manjericão","1 pitada de pimenta-do-reino"],
 prep:["Coloque a berinjela no escorredor e salpique com o sal. Deixe descansar por 30 minutos. Seque com um papel-toalha.","Misture o alho com o manjericão e a pimenta. Coloque as fatias num tabuleiro forrado com papel-alumínio. Passe metade do alho nas fatias e leve ao forno moderado por 10 minutos.","Vire as fatias, passe o restante do alho e asse por mais 10 minutos ou até ficar tenro."],
 obs:["Bom acompanhamento para grelhados ou omelete."]},

{id:"legumes-refogados-ervas", t:"Legumes refogados com ervas", g:["legumes"],
 ing:["2 cenouras médias raladas","1 abobrinha média ralada","2 colheres de sopa de cebola roxa picadinha","Uma mistura de orégano e manjericão"],
 prep:["Esquente a frigideira com um pingo de óleo e coloque a cebola até que ela fique transparente.","Coloque os legumes e mexa um pouco.","Coloque os temperos a gosto e sirva em seguida."],
 obs:["Bom acompanhamento para grelhados ou omelete."]},

{id:"arroz-couve-flor", t:"“Arroz” de couve-flor", g:["legumes"],
 ing:["15 floretes de couve-flor","1 colher de sobremesa de azeite","1 colher de sopa de salsinha picada","Sal e pimenta-do-reino a gosto"],
 prep:["Cozinhe a couve-flor no vapor por cerca de 3 minutos.","Transfira a couve-flor para uma tábua e pique muito bem com uma faca afiada. Cuidado para não picar demais, pois pode virar purê. Reserve.","Coloque o azeite numa frigideira grande e leve ao fogo médio para aquecer. Acrescente a couve-flor picada e refogue por cerca de 2 minutos. Tempere com sal, pimenta-do-reino e a salsinha picada. Misture bem e desligue o fogo."]},

{id:"arroz-couve-flor-oregano", t:"“Arroz” de couve-flor com orégano", g:["legumes"], rend:"3 a 4 porções",
 ing:["1 couve-flor média","1 colher de sobremesa de azeite","1 colher de café rasa de orégano","Sal e pimenta-do-reino a gosto"],
 prep:["Cozinhe a couve-flor no vapor por cerca de 3 minutos.","Transfira a couve-flor para uma tábua e pique muito bem com uma faca afiada. Cuidado para não picar demais, pois pode virar purê. Reserve.","Coloque o azeite numa frigideira grande e leve ao fogo médio para aquecer. Acrescente a couve-flor picada e refogue por cerca de 2 minutos. Tempere com sal e pimenta-do-reino. Polvilhe o orégano e desligue o fogo."]},

{id:"omelete-legumes", t:"Omelete com legumes", g:["legumes"],
 ing:["2 ovos orgânicos ou caipiras","4 colheres de sopa de alho-poró","1 tomate sem sementes em cubos","2 colheres de sopa de cebola","4 colheres de sopa de palmito em cubinhos","Ervas a gosto (orégano, manjericão, alecrim etc.)","Sal a gosto"],
 prep:["Bata os ovos e tempere com o sal.","Coloque a cebola com 1 colher de chá de óleo de canola na frigideira, refogue rapidamente e coloque o alho-poró, o tomate, o palmito e as ervas. Reserve.","Coloque a mistura de ovos na frigideira e espere endurecer um pouco. Em seguida, coloque o refogado e feche a omelete. Sirva a seguir, acompanhada de salada verde."],
 obs:["Você pode escolher outros legumes. Tente colocar 2 ou 3 tipos diferentes.","Refogue um espinafre ou agrião para acompanhar!"]},

{id:"omelete-forno-espinafre", t:"Omelete de forno com espinafre", g:["legumes"],
 ing:["1 colher (sopa) de azeite","1 cebola média picada","1 dente de alho amassado","1 e ½ xícara (chá) de folhas de espinafre fatiadas","3 ovos","1 tomate picado","½ xícara (chá) de leite de arroz","½ colher de chá de fermento em pó","½ colher de chá de orégano","Salsinha a gosto","Sal e pimenta a gosto"],
 prep:["Refogue o alho e a cebola no azeite. Em seguida acrescente as folhas de espinafre e refogue até murchar. Se precisar, coloque uma colher de sopa de água.","Pré-aqueça o forno a 180 graus.","Em um recipiente, bata os ovos com o sal, a pimenta, o orégano, o leite de arroz, o tomate, o fermento e a salsinha. Adicione o espinafre refogado, mexa bem e despeje em um refratário untado. Asse por cerca de 25 a 30 minutos."],
 obs:["As quantidades desta receita foram lidas de uma foto borrada. Vale conferir com o papel original."]},

{id:"sufle-legumes", t:"Suflê de legumes", g:["legumes","tortas"],
 ing:["2 abobrinhas raladas","1 cenoura ralada","1 xícara de vagem picadinha","1 cebola picada","2 dentes de alho amassados","½ talo de alho-poró finamente cortado","1 colher de sopa de farinha de arroz","2 colheres de sopa de farinha de amêndoas (é só bater as amêndoas no liquidificador; se não tiver, coloque 1 colher de sopa a mais de farinha de arroz)","3 gemas e 3 claras de ovo em neve","Azeite, sal e pimenta-branca moída a gosto"],
 prep:["Refogue no azeite a cebola, o alho e o alho-poró. Acrescente os legumes (ralados e picados) e refogue um pouco mais. Tempere com sal e pimenta a gosto.","Apague o fogo e misture ao refogado as farinhas e as gemas.","Por último, agregue delicadamente as claras batidas em neve.","Leve ao forno para assar por 30 minutos."]},

/* ===================== TORTAS, QUICHES E EMPADÕES ===================== */
{id:"torta-primavera", t:"Torta primavera", g:["tortas","legumes"],
 ing:["2 batatas-doces raladas","2 abobrinhas raladas","2 cenouras raladas","Sal, pimenta-do-reino, ervas desidratadas e açafrão (cúrcuma) a gosto","3 ovos","3 colheres de sopa de cheiro-verde picado","200 g de queijo minas padrão ralado (pode ser sem lactose para os intolerantes, ou omita da receita para os alérgicos)"],
 prep:["Em um refratário untado com azeite, disponha as batatas, as abobrinhas e as cenouras raladas e temperadas com sal, pimenta-do-reino, açafrão e ervas desidratadas.","Bata os ovos ligeiramente e misture com o cheiro-verde. Jogue por cima dos legumes e, por último, o queijo ralado.","Leve ao forno por 30 a 40 minutos."]},

{id:"quiche-brocolis-grao-bico", t:"Quiche de brócolis com massa de grão-de-bico", g:["tortas"],
 ing:["2 xícaras de grão-de-bico cozido com um pouco de sal (reserve um pouco da água do cozimento)","5 ovos orgânicos ou caipiras","100 g de queijo de búfala ralado (aquele queijo de búfala duro, tipo queijo prato)","2 xícaras de brócolis ou couve-flor cozido e picado, ou tomate, cebola roxa etc.","Sal e pimenta a gosto","Azeite e alguma farinha para polvilhar"],
 prep:["Bata o grão-de-bico no processador ou liquidificador com um pouco da água do cozimento até virar uma pasta modelável (coloque a água aos pouquinhos).","Unte uma forma de aro removível de 23 cm com azeite e polvilhe com farinha (no original foi usada farinha de arroz).","Distribua a massa de grão-de-bico no fundo e na lateral da forma, nivelando com as costas de uma colher.","Distribua o queijo e o brócolis. Bata os cinco ovos e tempere com sal e pimenta.","Despeje os ovos sobre o recheio e leve para assar em forno preaquecido a 180 graus por 40 minutos ou até que esteja firme no centro e dourado. Espere a torta esfriar para servir."]},

{id:"torta-couve-flor-frango", t:"Torta de couve-flor com frango", g:["tortas","frango"],
 ing:["2 xícaras de frango desfiado temperado","1 xícara de chá de cenoura ralada","1 xícara de chá de vagem picada","1 couve-flor inteira","½ xícara de chá de salsinha","1 ovo","Sal e pimenta-do-reino a gosto","½ xícara de chá de farelo de aveia","1 colher de sopa de requeijão de búfala","Azeite para untar"],
 prep:["Corte a couve-flor em pedaços grandes e cozinhe no vapor até ficar bem molinha. Bata a couve-flor com um mixer, adicione o farelo de aveia e a clara e misture bem.","Misture em outro recipiente o frango, a cenoura, a vagem, a salsinha e uma pitada de sal.","Forre o fundo e as laterais de uma forma untada com a massa e coloque metade do recheio. Por cima ponha o requeijão e a outra metade do recheio.","Feche com o restante da massa, pincele a gema e leve ao forno por 25 a 30 minutos."]},

{id:"empadao-grao-bico-legumes", t:"Empadão de grão-de-bico com recheio de legumes", g:["tortas"],
 ing:["#Massa","500 gramas de grão-de-bico","Cheiro-verde picado (um molho)","Sal a gosto","Alho a gosto","Azeite de oliva a gosto","#Recheio","2 colheres de sopa de azeite","1 cebola média picadinha","3 dentes de alho picados","1 pimentão vermelho em cubinhos","3 colheres de sopa de molho de tomates","Sal e ervas a gosto","2 cenouras médias em cubos","2 abobrinhas em cubos"],
 prep:["#Massa de grão-de-bico","Deixe o grão-de-bico de molho por 6 horas. Cozinhe com um pouco de sal até ficar macio.","Escorra e passe na peneira ou no espremedor de batata.","Bata com um pouco de azeite e forre uma vasilha refratária, deixando um pouco de massa para cobrir a torta.","#Recheio","Cozinhe a cenoura no vapor e reserve.","Refogue a cebola, o alho e o pimentão até ficarem macios. Acrescente o molho de tomate e refogue por alguns minutos.","Acrescente a abobrinha e 50 ml de água e tempere com sal, pimenta e ervas a gosto. Deixe cozinhar até que os legumes fiquem macios. Se necessário, vá acrescentando mais água aos poucos, mas cuidado: o caldo deve ficar bem espesso.","Acrescente a cenoura cozida, misture bem e deixe no fogo por mais um minuto. Deixe esfriar e utilize.","#Montagem","Recheie o refratário e cubra com o restante do purê.","Pincele com azeite e leve ao forno para dourar."],
 obs:["Use a mesma massa para fazer com o recheio de frango tradicional!"]},

{id:"empadao-grao-bico-palmito", t:"Empadão de grão-de-bico com recheio de palmito", g:["tortas"],
 ing:["#Recheio","2 xícaras de palmito pupunha picado em cubinhos","1 xícara de vagem cortada fina","1 xícara de cenoura cortada em cubinhos","½ xícara de azeitona preta sem caroço","½ cebola picada","3 colheres de sopa de azeite","1 colher de sobremesa rasa de araruta, amido de milho ou fécula de batata","1 colher de sobremesa de orégano","1 xícara de água","#Massa","1 xícara de grão-de-bico cozido na água e sal","1 colher de sopa de ghee","1 colher de chá de sal","½ colher de chá de cúrcuma","¾ xícara de farinha de arroz","¼ xícara de água gelada"],
 prep:["#Recheio","Refogue a cebola com azeite numa panela média.","Acrescente o palmito, a vagem e a cenoura e cozinhe com um pouquinho de água até ficar al dente.","Dilua a araruta em 1 xícara de água e adicione aos vegetais, mexendo em fogo médio até ficar bem transparente e espesso.","Acrescente a azeitona, misture e desligue o fogo. Deixe o recheio esfriar enquanto faz a massa.","#Massa","No processador, coloque o grão-de-bico cozido, o ghee, o sal e a cúrcuma e processe para misturar.","Adicione a água e a farinha aos poucos e processe até virar uma massa bem empelotada.","Forre 5 potinhos de porcelana com a massa, recheie e cubra com mais massa. Leve ao forno por 30 minutos a 180 °C."],
 obs:["Use a mesma massa para fazer com o recheio de frango tradicional!"]},

{id:"empadao-grao-bico-frango", t:"Empadão com massa de grão-de-bico e frango", g:["tortas","frango"],
 ing:["#Massa","250 g de grão-de-bico bem cozido (12 horas de molho)","2 colheres de sopa de azeite","Temperos","#Recheio","Frango desfiado","Molho de tomate","Cenoura","Cebola","Brócolis","#Para pincelar","1 gema"],
 prep:["Bata ou amasse o grão-de-bico com o azeite e os temperos.","Forre o refratário com a massa.","Coloque o recheio.","Cubra com massa de novo e, por cima, pincele a gema.","Leve ao forno preaquecido por 30 minutos."]},

{id:"tortinhas-tipo-quiche", t:"Tortinhas individuais tipo quiche", g:["tortas","frango"],
 ing:["2 xícaras de frango desfiado","1 ovo inteiro","2 claras","2 colheres de sopa de farinha de linhaça dourada","1 colher de café de fermento em pó","Temperos (ervinhas) a gosto: manjericão, orégano, alecrim...","Cenoura ralada, espinafre, beterraba... fica à sua escolha!"],
 prep:["Misture tudo aos poucos.","Coloque em forminhas individuais (tipo suflê) e leve ao forno por aproximadamente 20 a 25 minutos."]},

{id:"torta-cenoura-abobrinha", t:"Torta de cenoura com abobrinha", g:["tortas"],
 ing:["1 abobrinha ralada","1 cenoura ralada","1 cebola picadinha","2 colheres de sopa de azeitona verde picada","2 colheres de sopa de amaranto em flocos","½ colher de sopa de amido","4 ovos","2 colheres de sopa de azeite","2 colheres de sopa de cheiro-verde picado","Noz-moscada, sal e pimenta a gosto"],
 prep:["Refogue a cebola e o alho no azeite. Acrescente a abobrinha e a cenoura e refogue um pouco mais (até secar a água que a abobrinha liberar).","Acrescente as azeitonas, o cheiro-verde, o sal, a noz-moscada, a pimenta, o amaranto e o amido. Cozinhe um pouco mais (5 minutos), desligue o fogo e reserve.","À parte, bata bem os ovos em uma batedeira.","Despeje o refogado nos ovos batidos, misture tudo e leve para assar em forno preaquecido por 30 minutos."]},

{id:"quiche-espinafre", t:"Quiche de espinafre", g:["tortas"],
 ing:["#Massa","1 ovo orgânico","½ xícara de café de azeite (25 ml)","½ vidro de leite de coco light (100 ml)","1 colher de sopa rasa de manteiga ghee","½ colher de café de açafrão","2 colheres de sopa de farinha de linhaça (30 gramas)","1 xícara de chá de creme ou farinha de arroz (120 gramas)","1 xícara de chá de polvilho doce (90 gramas)","2 colheres de chá de fermento em pó químico (10 gramas)","Sal a gosto (se for sal marinho, melhor)","#Recheio","300 gramas de ricota de búfala ou lac free","80 gramas de espinafre picado","4 azeitonas pretas sem caroço picadas","Salsa a gosto","Pimenta a gosto"],
 prep:["#Massa","Misture os ingredientes, amasse-os e abra com um rolo, sobre uma bancada enfarinhada com farinha de arroz. A massa não deve grudar na mão. Se necessário, acrescente mais farinha de arroz. Se estiver quebradiça, coloque 1 a 2 colheres de água gelada. Reserve.","#Recheio","Misture todos os ingredientes do recheio e reserve.","#Montagem","Abra a massa com um rolo sobre a bancada enfarinhada. Assente-a em uma forma para quiche (individual) ou em forma de aro removível.","Fure-a aleatoriamente com um garfo, coloque o recheio (frio) e leve ao forno preaquecido a 210 graus. Asse por 20 a 30 minutos, até ficar dourada."]},

{id:"torta-rapida-atum", t:"Torta rápida de atum", g:["tortas","peixes"],
 ing:["#Massa","3 ovos","1 xícara (chá) de água (240 ml)","¼ xícara (chá) de azeite de oliva (ou óleo de girassol)","½ xícara (chá) de farinha de arroz integral","½ xícara (chá) de farinha de grão-de-bico","1 colher (sopa) cheia de amido de milho","1 colher (chá) de sal","1 colher (sopa) de fermento químico para bolos","#Recheio","1 lata de atum em óleo (drene o óleo)","1 cenoura média ralada","1 cebola cortada em rodelas","10 azeitonas picadinhas (lave em água corrente antes de colocar no recheio, para tirar o excesso de sal)","Orégano e semente de chia para polvilhar"],
 prep:["Misture o recheio em uma vasilha e reserve.","Bata todos os ingredientes da massa (menos o fermento) no liquidificador. Quando estiver homogêneo, acrescente o fermento e bata mais uma vez, apenas para misturar.","Despeje a massa (que fica bem líquida mesmo) em cima do recheio e misture bem.","Coloque em uma forma untada com óleo e leve ao forno médio preaquecido por aproximadamente 30 minutos. Faça o teste do palito."]},
/* ===================== HAMBÚRGUERES, QUIBES E LANCHES ===================== */
{id:"hamburguer-patinho-quinoa", t:"Hambúrguer de patinho com quinoa", g:["lanches","carnes"],
 ing:["½ kg de patinho moído","2 gemas de ovo","2 colheres de sopa de flocos de quinoa","Salsinha","Cebola"],
 prep:["Junte tudo e modele os hambúrgueres.","Leve ao forno."]},

{id:"hamburguer-legumes", t:"Hambúrguer de legumes", g:["lanches","carnes"],
 ing:["500 g de carne moída","1 ovo","2 colheres de sopa de farelo de aveia","2 colheres de sopa de cenoura ralada","1 colher de sopa de semente de chia","2 colheres de sopa de couve-flor ralada (só as flores)","1 colher de sopa de cheiro-verde picadinho","2 colheres de sopa de cebola ralada","Sal e pimenta-do-reino moída a gosto"],
 prep:["Tempere a carne com a cebola, o cheiro-verde, o sal e a pimenta e deixe na geladeira por 30 minutos.","Depois misture os demais ingredientes e molde em formato de hambúrguer com cerca de 2 cm de altura (pode usar formas próprias ou um copo de boca larga).","Grelhe na frigideira untada com azeite até dourar ambos os lados."]},

{id:"hamburguer-caseiro-carne", t:"Hambúrguer caseiro de carne", g:["lanches","carnes"], rend:"3 porções",
 ing:["500 g de carne moída","⅓ de xícara de cebola picada","3 dentes de alho picados","1 colher de chá de sal","1 ovo caipira","½ colher de chá de tomilho seco","2 colheres de sopa de farinha de linhaça dourada","1 cenoura ralada (use o buraquinho mais fino do ralador)","Azeite para untar"],
 prep:["No processador, bata todos os ingredientes até obter uma pasta, ou misture bem com as mãos.","Divida a mistura em quatro porções. Sobre uma superfície lisa untada com óleo, forme com cada porção um hambúrguer, usando um cortador de biscoito de 8 cm de diâmetro.","Aqueça bem uma grelha em fogo alto, pincele-a ligeiramente com óleo e reduza a chama para média. Deixe os hambúrgueres dourarem por cerca de 2 minutos de cada lado e sirva-os quentes."]},

{id:"hamburguer-salmao", t:"Hambúrguer de salmão", g:["lanches","peixes"],
 ing:["1 xícara de cebola cortada","¼ xícara de manjericão picado","¼ colher de chá de sal","⅓ colher de chá de pimenta preta","450 g de filé de salmão cortado em pedaços","1 colher de sopa de Tabasco","1 ovo caipira"],
 prep:["Misture o salmão com a cebola, o manjericão, o sal e a pimenta preta em uma tigela. Em outra, coloque o Tabasco e o ovo e misture. Então, junte o conteúdo dos dois recipientes. Mexa bem.","Divida a mistura em quatro porções iguais e molde cada uma delas com cerca de 1 cm de grossura.","Em fogo médio, grelhe por três minutos de cada lado ou até alcançar o ponto desejado."]},

{id:"hamburguer-couve-flor", t:"Hambúrguer de couve-flor", g:["lanches","legumes"],
 ing:["1 couve-flor grande","Pimenta-do-reino a gosto","2 cabeças de alho","Meia cebola","Tempero verde a gosto","½ xícara de farinha de trigo integral","1 ovo","Farinha de trigo integral para empanar"],
 prep:["Cozinhe a couve-flor no vapor por 15 minutos, até que fique bem macia. Amasse a couve-flor com o auxílio de um garfo.","Misture o sal, a pimenta, o alho, a cebola, a salsinha, a farinha e o ovo.","Molde hambúrgueres com a mistura de couve-flor e passe na farinha.","Frite na fritadeira elétrica sem óleo ou leve ao forno. Deixe até ficarem dourados e crocantes dos dois lados."],
 obs:["O papel original diz mesmo “2 cabeças de alho”. Se achar muito, comece com 2 dentes."]},

{id:"hamburguer-lentilha", t:"Hambúrguer de lentilha", g:["lanches"], rend:"5 hambúrgueres",
 ing:["1 xícara de chá de lentilha crua","4 xícaras de chá de água","1 dente de alho grande picado","½ xícara de chá de cebola picada","½ xícara de chá de cheiro-verde","1 colher de sopa de azeite","1 colher de chá de sal","Cominho a gosto","½ xícara de chá de farinha de trigo integral"],
 prep:["O ideal é deixar a lentilha de molho na água por 8 horas antes de cozinhar.","Cozinhe a lentilha na pressão com as 4 xícaras de água por 5 minutos, para que ela fique mais macia.","Adicione o alho, a cebola, o cheiro-verde, o azeite e o sal, tempere com cominho a gosto e misture tudo.","Acrescente a farinha de trigo integral aos poucos, até dar o ponto de modelar. Modele os hambúrgueres com cerca de 1,5 cm de espessura.","Coloque os hambúrgueres em uma forma untada ou com papel-manteiga e leve ao freezer por uma hora.","Retire com cuidado e leve para assar em uma assadeira antiaderente com um fio de azeite. Vire quando estiver bem dourado."]},

{id:"quibe-quinoa", t:"Quibe de quinoa", g:["lanches","carnes"],
 ing:["2 xícaras de quinoa em grãos (deixe de molho e lave muito bem antes de consumir)","½ kg de carne moída (patinho)","2 cebolas bem picadinhas","4 colheres de sopa de azeite","Hortelã (muito) e sal (pouco) a gosto","Suco de 1 limão"],
 prep:["Cozinhe a quinoa com o dobro de água por 15 minutos.","Escorra bem a água e misture com os demais ingredientes.","Coloque em um refratário e leve ao forno preaquecido por 35 a 45 minutos."],
 obs:["Você pode optar por recheá-lo. No original foi usada mozarela de búfala e espinafre!"]},

{id:"quibe-quinoa-abobora-frango", t:"Quibe de quinoa com abóbora e frango", sub:"Kibe mediterrâneo", g:["lanches","frango"],
 ing:["100 g de abóbora cabotiá cozida com casca","100 g de quinoa cozida","400 g de peito de frango moído","1 colher de sopa (20 ml) de azeite de oliva extra virgem","½ cebola roxa","1 dente de alho","15 g de salsinha e hortelã bem picadinhas","Sal do Himalaia e pimenta síria a gosto"],
 prep:["Coloque a abóbora em pedaços para cozinhar com casca, até que a polpa fique em uma consistência que dê para amassar com um garfo.","Deixe esfriar, passe no processador com a casca e reserve. Se for necessário, coloque um pouco da água do cozimento para bater.","Em seguida, misture todos os ingredientes em um bowl, com as mãos.","Pré-aqueça o forno a 180 graus. Coloque em uma forma untada com azeite e leve ao forno por 30 minutos."],
 obs:["Para fazer uma variação sem frango, é só aumentar a porção de abóbora para 400 g e a de quinoa para 150 g, e fazer da mesma forma."]},

{id:"quibe-carne-quinoa", t:"Quibe de carne com quinoa", g:["lanches","carnes"],
 ing:["⅓ xícara de chá de quinoa em grãos crua","1 xícara de chá de água","400 g de carne moída magra (sugestão: patinho)","½ cebola média","½ maço de hortelã","Sal e pimenta síria ou do reino"],

{id:"quibe-lentilha", t:"Quibe de lentilha", g:["lanches"],
 ing:["#Trigo","1 xícara (chá) de trigo para quibe","2 xícaras (chá) de água morna","#Lentilha","1 xícara (chá) de lentilha","6 xícaras (chá) de água","4 colheres (sopa) de azeite","1 cebola pequena picada","5 dentes de alho picados","2 colheres (chá) de sal","2 colheres (sopa) de hortelã picada","#Para rechear","200 g de queijo branco fatiado","#Para untar","Azeite"],
 prep:["#Trigo","Em uma tigela, coloque o trigo para quibe e a água morna e deixe hidratar por 20 minutos. Escorra o excesso de água e reserve.","#Lentilha","Em uma panela, coloque a lentilha e a água. Cozinhe em fogo médio com a panela parcialmente tampada por 35 minutos ou até que os grãos estejam cozidos. Escorra a água e deixe amornar.","Em um processador, bata a lentilha até obter um creme homogêneo. Reserve.","Em uma panela, aqueça o azeite em fogo médio e doure a cebola e o alho. Reserve.","Em uma tigela, junte o trigo para quibe, a lentilha batida, a cebola e o alho. Tempere com o sal e a hortelã.","#Montagem","Em um refratário de 21 x 21 cm untado com azeite, coloque metade da massa do quibe, distribua as fatias de queijo e complete com o restante da massa.","Asse em forno preaquecido a 180 °C por 20 minutos ou até que a superfície esteja dourada. Sirva em seguida."]},

{id:"salgado-frango", t:"Salgado de frango", g:["lanches","frango"],
 ing:["120 g de frango desfiado (cozido)","40 g de brócolis ou couve-flor (cozido)","Temperinhos (você pode colocar cebola, manjericão, entre outros)","1 gema","2 colheres de sopa de água (opcional: só se a massa estiver bem seca)"],
 prep:["Bata no processador o frango, o brócolis e os temperinhos até formar uma pasta homogênea e firme.","Para modelar a massa, coloque um saquinho plástico por baixo: assim fica fácil modelar com as mãos. Despeje a massa e abra bem.","Recheie a gosto. Sugestão: um pouquinho de frango desfiado, brócolis e palmito.","Pegue o saquinho e vá modelando a massa para fechar o salgado.","Pincele um pouco de gema para dourar.","Unte a forma para não grudar e coloque no forno. Deixe cerca de 20 minutos ou até dourar o salgado, pois já está tudo cozido."]},

{id:"bolinho-frango-batata-doce", t:"Bolinho de frango com batata-doce", g:["lanches","frango"],

{id:"pastel-linhaca-brocolis", t:"Pastel de linhaça com recheio de brócolis", g:["lanches"],
 ing:["500 g de linhaça marrom","100 g de amido de milho","100 g de brócolis","1 dente de alho","Meia cebola picadinha","2 colheres de sopa de azeite","Sal e pimenta-branca a gosto"],
 prep:["#Massa","Bata a linhaça no liquidificador até virar uma farinha. Coloque em uma tigela e adicione meio copo de água e sal a gosto. Misture bem. Deixe descansar por 10 minutos.","#Recheio","Em uma panela, coloque o azeite e doure o alho e a cebola. Adicione o brócolis já picado e mexa.","Dilua o amido em meia xícara de água e coloque na panela. Misture bem. Coloque sal e pimenta a gosto e mexa até engrossar.","#Montagem","Abra a massa com um rolo em cima de uma mesa forrada com plástico (pode ser aquele saco do mercado onde se colocam legumes e frutas).","Recheie e corte com um aro de metal ou a boca de um copo. Feche e leve ao forno por 10 minutos."]},

{id:"pizza-couve-flor", t:"Pizza de couve-flor", g:["lanches","legumes"],
 ing:["1 couve-flor picada (só as flores, previamente higienizada)","1 ovo","1 colher de sopa de biomassa de banana verde","1 colher de sobremesa de orégano","1 colher de chá de sal","1 dente de alho amassado"],

 obs:["Na receita original, no lugar da biomassa de banana verde vai ¾ de xícara de queijo minas padrão ralado. Ao substituir pela biomassa você ganha fibras, mais nutrientes e saúde!"]},

{id:"tapioca-rosa", t:"Tapioca rosa", g:["paes"],
 ing:["250 g de polvilho doce","¼ de beterraba crua","200 ml de água"],
 prep:["Bata no liquidificador o pedaço de beterraba junto com os 200 ml de água, por aproximadamente 1 minuto em velocidade alta, para que a beterraba fique em pedacinhos minúsculos.","Coe (de preferência 2 vezes) e reserve 150 ml do suco.","Misture aos poucos o suco da beterraba ao polvilho para hidratá-lo. O ponto certo é quando se faz um montinho de massa apertando na mão e ela não se quebra tão facilmente. Se ficar mole demais, coloque um pouquinho mais de polvilho; se ficar muito esfarelada, um pouco mais de suco.","Para preparar a tapioca, passe a massa pela peneira: coloque um punhado e pressione com as mãos. Cairá o pó fininho. Isso também pode ser feito diretamente sobre a frigideira quente.","Com a frigideira já aquecida, coloque aproximadamente 2 colheres de sopa de tapioca. Ajeite rapidamente com a colher, antes que ela comece a coagular.","Quando as bordas começarem a subir, é hora de virá-la. Se preferir, já coloque o recheio nesse momento e dobre-a ao meio. Se for queijo, isso ajuda a derreter."]},

{id:"tapioca-amarela", t:"Tapioca amarela", g:["paes"],
 ing:["250 g de polvilho doce","1 cenoura grande inteira","200 ml de água"],
 prep:["Bata a cenoura no liquidificador com a água, exatamente como na tapioca rosa.","Como a cenoura é mais fibrosa (e entra na receita em quantidade maior), é necessário coar de 2 a 3 vezes, para que fique somente o suco dela, sem polpa.","Misture aos poucos o suco ao polvilho para hidratá-lo, até que um montinho de massa apertado na mão não se quebre facilmente.","Passe a massa pela peneira. Com a frigideira já aquecida, coloque aproximadamente 2 colheres de sopa de tapioca e ajeite rapidamente com a colher.","Quando as bordas começarem a subir, vire a tapioca, ou coloque o recheio e dobre ao meio."]},

 prep:["Deixe o grão-de-bico de molho durante uma noite. Na manhã seguinte, escorra e transfira para uma panela. Cubra com água fervente e ferva por alguns minutos, até ficar al dente (cerca de 5 minutos). Escorra e deixe esfriar.","Pré-aqueça o forno a 180 °C.","Transfira o grão-de-bico para uma assadeira, salpique a páprica (e outros temperos que queira usar) e regue com o azeite. Misture tudo com as mãos para distribuir entre os grãos.","Asse até ficar dourado e crocante, mexendo de vez em quando."],

/* ===================== APP ===================== */
const $ = (s, el=document) => el.querySelector(s);
const tela = $("#tela"), splash = $("#splash"), app = $("#app"), btnVoltar = $("#voltar");
const porId = Object.fromEntries(RECEITAS.map(r => [r.id, r]));
const grupoPorId = Object.fromEntries(GRUPOS.map(g => [g.id, g]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const semAcento = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const ordenar = l => [...l].sort((a,b) => a.t.localeCompare(b.t, "pt-BR", {sensitivity:"base"}));
const limpo = s => s.replace(/^[“"”]+/, "");
RECEITAS.forEach(r => {
  r._busca = semAcento([r.t, r.sub||"", ...r.ing.filter(i => i[0] !== "#")].join(" "));
});

let termo = "";
let passosInternos = 0;   // quantas telas o usuário já navegou dentro do app
let travaTela = null;     // wake lock

$("#splash-sub").textContent = RECEITAS.length + " receitas da casa";

$("#entrar").addEventListener("click", () => { location.hash = "#/inicio"; });
btnVoltar.addEventListener("click", () => {
  if (passosInternos > 1) history.back(); else location.hash = "#/inicio";
});

function botaoReceita(r, mostrarGrupo){
  const g = mostrarGrupo ? `<small>${esc(grupoPorId[r.g[0]].n)}</small>` : "";
  const sub = r.sub ? `<small>${esc(r.sub)}</small>` : "";
  return `<li><button class="receita-btn" type="button" data-ir="#/r/${r.id}"><span>${esc(r.t)}${sub}${g}</span></button></li>`;
}

function telaInicio(){
  tela.innerHTML = `
    <div class="busca">
      <input id="campo-busca" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
             placeholder="Buscar receita ou ingrediente" aria-label="Buscar receita ou ingrediente" value="${esc(termo)}">
      <button type="button" id="limpar-busca" aria-label="Limpar busca" ${termo ? "" : "hidden"}>×</button>
    </div>
    <div id="conteudo-inicio"></div>`;
  const campo = $("#campo-busca"), limpar = $("#limpar-busca");
  campo.addEventListener("input", () => { termo = campo.value; limpar.hidden = !termo; pintarInicio(); });
  limpar.addEventListener("click", () => { termo = ""; campo.value = ""; limpar.hidden = true; pintarInicio(); campo.focus(); });
  pintarInicio();
}

function pintarInicio(){
  const alvo = $("#conteudo-inicio");
  const q = semAcento(termo.trim());
  if (q){
    const palavras = q.split(/\s+/);
    const achadas = ordenar(RECEITAS.filter(r => palavras.every(p => r._busca.includes(p))));
    alvo.innerHTML = achadas.length
      ? `<p class="sub">${achadas.length} ${achadas.length === 1 ? "receita encontrada" : "receitas encontradas"}</p>
         <ul class="lista">${achadas.map(r => botaoReceita(r, true)).join("")}</ul>`
      : `<div class="vazio">Nenhuma receita com “${esc(termo.trim())}”.<br>Tente outro ingrediente ou um pedaço do nome.</div>`;
    return;
  }
  const tiles = GRUPOS.map(g => {
    const n = RECEITAS.filter(r => r.g.includes(g.id)).length;
    return `<li><button class="grupo" type="button" data-ir="#/g/${g.id}">
      <span class="emoji" aria-hidden="true">${g.e}</span>
      <span class="nome">${esc(g.n)}</span>
      <span class="qtd">${n} receitas</span></button></li>`;
  }).join("");
  alvo.innerHTML = `
    <h2 class="titulo">Índice</h2>
    <p class="sub">Escolha um grupo para ver as receitas.</p>
    <ul class="grupos">${tiles}
      <li><button class="grupo todas" type="button" data-ir="#/g/todas">
        <span class="emoji" aria-hidden="true">📖</span>
        <span class="nome">Todas, de A a Z</span>
        <span class="qtd">${RECEITAS.length} receitas</span></button></li>
    </ul>`;
}

function telaGrupo(id){
  if (id === "todas"){
    let html = "", letraAtual = "";
    ordenar(RECEITAS).forEach(r => {
      const l = semAcento(limpo(r.t))[0].toUpperCase();
      if (l !== letraAtual){
        if (letraAtual) html += "</ul>";
        html += `<h3 class="letra">${l}</h3><ul class="lista">`;
        letraAtual = l;
      }
      html += botaoReceita(r, true);
    });
    tela.innerHTML = `<h2 class="titulo">Todas as receitas</h2><p class="sub">${RECEITAS.length} receitas em ordem alfabética.</p>${html}</ul>`;
    return;
  }
  const g = grupoPorId[id];
  if (!g) return telaNaoEncontrada();
  const lista = ordenar(RECEITAS.filter(r => r.g.includes(id)));
  tela.innerHTML = `
    <h2 class="titulo">${g.e} ${esc(g.n)}</h2>
    <p class="sub">${lista.length} receitas. Toque em uma para abrir.</p>
    <ul class="lista">${lista.map(r => botaoReceita(r, false)).join("")}</ul>`;
}

function secoes(itens, montarLista){
  // separa a lista nos subtítulos marcados com "#"
  const blocos = []; let atual = {h:null, itens:[]};
  itens.forEach(i => {
    if (i[0] === "#"){ if (atual.itens.length || atual.h) blocos.push(atual); atual = {h:i.slice(1), itens:[]}; }
    else atual.itens.push(i);
  });
  blocos.push(atual);
  return blocos.map(b => (b.h ? `<h4>${esc(b.h)}</h4>` : "") + (b.itens.length ? montarLista(b.itens) : "")).join("");
}

function telaReceita(id){
  const r = porId[id];
  if (!r) return telaNaoEncontrada();
  const etiquetas = r.g.map(gid => `<a class="etiqueta" href="#/g/${gid}">${esc(grupoPorId[gid].n)}</a>`).join("")
    + (r.rend ? `<span class="etiqueta rend">Rende ${esc(r.rend)}</span>` : "");
  const ing = secoes(r.ing, itens => `<ul class="ingredientes">${itens.map(i =>
    `<li><label><input type="checkbox"><span>${esc(i)}</span></label></li>`).join("")}</ul>`);
  const prep = secoes(r.prep, itens => `<ol class="passos">${itens.map(p => `<li>${esc(p)}</li>`).join("")}</ol>`);
  const obs = r.obs && r.obs.length
    ? `<section class="bloco dicas"><h3>Dicas e observações</h3><ul>${r.obs.map(o => `<li>${esc(o)}</li>`).join("")}</ul></section>` : "";
  const podeTravar = "wakeLock" in navigator;
  tela.innerHTML = `
    <article>
      <h2 class="titulo">${esc(r.t)}</h2>
      ${r.sub ? `<p class="sub" style="margin-bottom:0">Também conhecido como ${esc(r.sub)}</p>` : ""}
      <div class="etiquetas">${etiquetas}</div>
      <div class="acoes">
        ${podeTravar ? `<button class="btn-sec" id="trava" type="button" aria-pressed="false">Manter a tela ligada</button>` : ""}
        <button class="btn-sec" id="desmarcar" type="button">Desmarcar ingredientes</button>
      </div>
      <section class="bloco"><h3>Ingredientes</h3>${ing}</section>
      <section class="bloco"><h3>Modo de preparo</h3>${prep}</section>
      ${obs}
    </article>`;
  $("#desmarcar").addEventListener("click", () => tela.querySelectorAll(".ingredientes input").forEach(c => c.checked = false));
  const bt = $("#trava");
  if (bt) bt.addEventListener("click", async () => {
    try{
      if (travaTela){ await travaTela.release(); travaTela = null; }
      else { travaTela = await navigator.wakeLock.request("screen"); travaTela.addEventListener("release", () => { travaTela = null; atualizarTrava(); }); }
    }catch(e){ bt.textContent = "Tela ligada: indisponível aqui"; bt.disabled = true; return; }
    atualizarTrava();
  });
}
function atualizarTrava(){
  const bt = $("#trava"); if (!bt) return;
  bt.setAttribute("aria-pressed", travaTela ? "true" : "false");
  bt.textContent = travaTela ? "Tela ligada: ativado" : "Manter a tela ligada";
}
function soltarTrava(){ if (travaTela){ travaTela.release().catch(()=>{}); travaTela = null; } }

function telaNaoEncontrada(){
  tela.innerHTML = `<div class="vazio">Esta página não existe.<br><br><button class="btn-sec" type="button" data-ir="#/inicio">Voltar ao índice</button></div>`;
}

// navegação: qualquer elemento com data-ir muda o hash
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ir]");
  if (b) location.hash = b.dataset.ir;
});

function rota(){
  const h = location.hash;
  soltarTrava();
  if (!h || h === "#" || h === "#/"){
    app.hidden = true; splash.hidden = false; passosInternos = 0;
    return;
  }
  splash.hidden = true; app.hidden = false; passosInternos++;
  const [, tipo, id] = h.split("/");
  btnVoltar.hidden = (tipo === "inicio");
  if (tipo === "inicio") telaInicio();
  else if (tipo === "g") telaGrupo(decodeURIComponent(id || ""));
  else if (tipo === "r") telaReceita(decodeURIComponent(id || ""));
  else telaNaoEncontrada();
  window.scrollTo(0, 0);
  if (tipo !== "inicio") tela.focus({preventScroll:true});
}
window.addEventListener("hashchange", rota);
rota();
</script>
</body>
</html>
